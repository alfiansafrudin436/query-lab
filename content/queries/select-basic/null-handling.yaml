title: Tangani nilai NULL dengan IS NULL dan COALESCE
summary: Ganti nilai kosong dengan teks pengganti, dan saring baris berdasarkan ada atau tidaknya nilai.
whenToUse: Saat kolom boleh kosong dan kamu tidak ingin menampilkan sel kosong di antarmuka, atau saat perlu memisahkan baris yang nilainya belum diisi.
difficulty: beginner
tags: ['null', 'is null', coalesce, ifnull, nilai kosong]
popularity: 7
createdAt: '2026-10-13'
updatedAt: '2026-10-13'
related: [case-when, left-join, where-filter]
variants:
  - dialects: [postgresql, mysql, sqlite]
    code: |
      SELECT
        e.id,
        e.name,
        COALESCE(e.department, '(belum diisi)') AS department,
        COALESCE(m.name, '(tidak punya atasan)') AS manager_name
      FROM employees e
      LEFT JOIN employees m ON m.id = e.manager_id
      WHERE e.salary IS NOT NULL
      ORDER BY e.id;
    explanation:
      - lines: [1, 3]
        clause: SELECT e.id, e.name
        text: Kolom yang pasti terisi ditampilkan apa adanya.
      - lines: [4, 4]
        clause: COALESCE(e.department, '(belum diisi)')
        text: COALESCE mengembalikan argumen pertama yang bukan NULL. Jadi department yang kosong tampil sebagai teks pengganti, bukan sel kosong.
      - lines: [5, 5]
        clause: COALESCE(m.name, '(tidak punya atasan)')
        text: Di sini NULL-nya bukan berasal dari data, melainkan dari LEFT JOIN yang tidak menemukan pasangan.
      - lines: [6, 7]
        clause: LEFT JOIN employees m ON m.id = e.manager_id
        text: Tabel employees digabung ke dirinya sendiri untuk mengambil nama atasan. LEFT JOIN dipakai agar karyawan tanpa atasan tetap muncul.
      - lines: [8, 8]
        clause: WHERE e.salary IS NOT NULL
        text: 'Pemeriksaan NULL wajib memakai IS NULL atau IS NOT NULL. Menulis salary <> NULL tidak akan pernah bernilai benar.'
      - lines: [9, 9]
        clause: ORDER BY e.id
        text: Urutkan berdasarkan id karyawan.
sample:
  description: Andi tidak punya atasan, jadi hasil LEFT JOIN-nya NULL dan diganti teks. Di data contoh semua department terisi, sehingga COALESCE pada kolom itu tidak terpicu.
  input:
    - caption: employees
      columns: [id, name, manager_id, department, salary]
      rows:
        - [1, Andi Saputra, null, Operasional, 15000000]
        - [2, Budi Hartono, 1, Operasional, 9000000]
        - [3, Citra Dewi, 1, Gudang, 8500000]
  output:
    caption: Hasil
    columns: [id, name, department, manager_name]
    rows:
      - [1, Andi Saputra, Operasional, (tidak punya atasan)]
      - [2, Budi Hartono, Operasional, Andi Saputra]
      - [3, Citra Dewi, Gudang, Andi Saputra]
notes:
  - type: warning
    title: NULL bukan nol dan bukan teks kosong
    text: NULL berarti "tidak diketahui". Perbandingan apa pun dengannya menghasilkan NULL, bukan true atau false, sehingga baris tersebut tersaring keluar oleh WHERE. Inilah sebabnya IS NULL diperlukan.
  - type: warning
    title: NULL di dalam perhitungan
    text: Operasi aritmetika dengan NULL menghasilkan NULL, jadi price * quantity menjadi NULL bila salah satunya kosong. Sebaliknya, SUM() dan AVG() justru mengabaikan baris NULL, sedangkan COUNT(*) tetap menghitungnya.
  - type: tip
    title: Padanan di tiap dialek
    text: COALESCE ada di ketiga database dan menerima argumen sebanyak apa pun, jadi inilah pilihan paling aman. MySQL dan SQLite juga punya IFNULL(a, b) untuk dua argumen, sedangkan PostgreSQL tidak.
  - type: tip
    text: Untuk mengubah nilai tertentu menjadi NULL, pakai kebalikannya, NULLIF(a, b), yang menghasilkan NULL bila a sama dengan b. Berguna untuk menghindari pembagian dengan nol, misalnya total / NULLIF(jumlah, 0).
