title: Hapus data duplikat, sisakan satu
summary: Hapus customer dengan email ganda dan pertahankan baris dengan id terkecil.
whenToUse: Saat membersihkan data ganda hasil impor atau input berulang, sebelum menambahkan UNIQUE constraint pada kolom tersebut.
difficulty: advanced
tags: [duplikat, delete, dedupe, bersih data]
popularity: 8
createdAt: '2026-10-05'
updatedAt: '2026-10-13'
related: [upsert, anti-join, subquery-in-exists]
variants:
  - dialects: [postgresql]
    code: |
      DELETE FROM customers a
      USING customers b
      WHERE a.email = b.email
        AND a.id > b.id;
    explanation:
      - lines: [1, 2]
        clause: DELETE FROM customers a USING customers b
        text: Gabungkan tabel dengan dirinya sendiri. Klausa USING khusus PostgreSQL untuk menyebut tabel tambahan di DELETE.
      - lines: [3, 3]
        clause: a.email = b.email
        text: Pasangkan setiap baris dengan baris lain yang email-nya sama.
      - lines: [4, 4]
        clause: a.id > b.id
        text: Hapus baris a yang id-nya lebih besar. Baris dengan id terkecil tidak pernah memenuhi kondisi ini, jadi selalu tersisa.
  - dialects: [mysql]
    code: |
      DELETE a FROM customers a
      JOIN customers b
        ON a.email = b.email
       AND a.id > b.id;
    explanation:
      - lines: [1, 1]
        clause: DELETE a FROM customers a
        text: Di MySQL, alias setelah DELETE menentukan tabel mana yang barisnya dihapus.
      - lines: [2, 3]
        clause: JOIN customers b ON a.email = b.email
        text: Gabungkan tabel dengan dirinya sendiri berdasarkan email yang sama.
      - lines: [4, 4]
        clause: AND a.id > b.id
        text: Hapus baris a yang id-nya lebih besar, sehingga baris dengan id terkecil tersisa.
  - dialects: [sqlite]
    code: |
      DELETE FROM customers
      WHERE id NOT IN (
        SELECT MIN(id) FROM customers
        GROUP BY email
      );
    explanation:
      - lines: [3, 4]
        clause: SELECT MIN(id) … GROUP BY email
        text: Cari id terkecil untuk setiap email. Baris-baris inilah yang dipertahankan.
      - lines: [2, 5]
        clause: WHERE id NOT IN (…)
        text: Hapus semua baris lain. Aman dipakai karena id adalah PRIMARY KEY dan tidak pernah NULL.
sample:
  description: Rina mendaftar dua kali dengan email yang sama. Baris dengan id lebih besar dihapus.
  highlightNote: Baris yang disorot = baris yang terhapus
  input:
    - caption: Sebelum · customers
      columns: [id, name, email]
      rows:
        - [1, Rina Wijaya, rina@example.com]
        - [2, Dimas Pratama, dimas@example.com]
        - [3, Sari Lestari, sari@example.com]
        - [4, Rina W., rina@example.com]
      highlight: [[3, 0], [3, 1], [3, 2]]
  output:
    caption: Sesudah · customers
    columns: [id, name, email]
    rows:
      - [1, Rina Wijaya, rina@example.com]
      - [2, Dimas Pratama, dimas@example.com]
      - [3, Sari Lestari, sari@example.com]
notes:
  - type: warning
    title: Cek dulu sebelum menghapus
    text: Jalankan SELECT dengan kondisi yang sama untuk melihat baris yang akan terhapus, lalu lakukan DELETE di dalam transaksi (BEGIN … COMMIT) agar bisa di-ROLLBACK.
  - type: info
    title: Relasi ke tabel lain
    text: Jika baris duplikat sudah dipakai tabel lain (misalnya orders.customer_id), pindahkan dulu relasinya ke id yang dipertahankan. Tanpa itu, DELETE gagal karena foreign key.
  - type: tip
    text: Setelah data bersih, tambahkan UNIQUE pada kolom email agar duplikat tidak muncul lagi.
